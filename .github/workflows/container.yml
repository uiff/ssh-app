# Baut das Container-Image fuer linux/amd64 und linux/arm64 und veroeffentlicht es:
#   - ghcr.io/uiff/keyway        immer (mit dem GITHUB_TOKEN des Laufs)
#   - docker.io/iotuelich/keyway nur, wenn die Repository-Secrets DOCKERHUB_USERNAME und DOCKERHUB_TOKEN gesetzt sind
#     (Docker-Hub-Zugriffstoken mit «Read, Write, Delete», sonst scheitert der Abgleich der Beschreibung).
# Ausloeser:
#   - Versions-Tag:  git tag v0.3.0 && git push origin v0.3.0   -> Tags 0.3.0, 0.3 und latest
#   - von Hand:      Actions › Container › Run workflow (Branch main) -> Tag edge
name: Container

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: false

env:
  GHCR_IMAGE: ghcr.io/uiff/keyway
  DOCKERHUB_IMAGE: docker.io/iotuelich/keyway
  DOCKERHUB_REPO: iotuelich/keyway
  PLATTFORMEN: linux/amd64,linux/arm64
  # Beschreibung und Herkunft auch am Image-Index (mehrere Plattformen), nicht nur je Plattform
  DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index

jobs:
  test:
    name: Test
    uses: ./.github/workflows/ci.yml

  image:
    name: Image
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    env:
      DOCKERHUB: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Anmelden bei ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Anmelden bei Docker Hub
        if: env.DOCKERHUB == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker Hub nicht eingerichtet
        if: env.DOCKERHUB != 'true'
        run: echo "::warning title=Docker Hub::Secrets DOCKERHUB_USERNAME und DOCKERHUB_TOKEN fehlen, das Image geht nur nach ghcr.io."

      - name: Tags und Labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.GHCR_IMAGE }}
            name=${{ env.DOCKERHUB_IMAGE }},enable=${{ env.DOCKERHUB == 'true' }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=edge,branch=main
          labels: |
            org.opencontainers.image.title=Keyway
            org.opencontainers.image.description=Self-hosted web SSH & VNC client with SFTP, encrypted vault and offline command help
            org.opencontainers.image.vendor=IoTUeli
            org.opencontainers.image.url=https://hub.docker.com/r/iotuelich/keyway
            org.opencontainers.image.documentation=https://github.com/uiff/ssh-app#readme
          annotations: |
            org.opencontainers.image.title=Keyway
            org.opencontainers.image.description=Self-hosted web SSH & VNC client with SFTP, encrypted vault and offline command help
            org.opencontainers.image.vendor=IoTUeli
            org.opencontainers.image.url=https://hub.docker.com/r/iotuelich/keyway
            org.opencontainers.image.documentation=https://github.com/uiff/ssh-app#readme

      # Erst nur amd64 bauen, lokal laden und starten: veroeffentlicht wird nur ein Image, das hochkommt.
      - name: Probebau (amd64)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: keyway:probe
          build-args: VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha

      - name: Probelauf
        run: |
          docker run -d --name probe -p 127.0.0.1:8443:8443 keyway:probe
          for i in $(seq 1 30); do
            if curl -fsSk https://127.0.0.1:8443/ -o seite.html; then break; fi
            sleep 1
          done
          grep -q '<title>Keyway' seite.html
          docker exec probe /app/ssh-app gesund
          docker logs probe
          docker rm -fv probe

      - name: Bauen und veroeffentlichen
        id: bau
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ env.PLATTFORMEN }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          build-args: VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Beschreibung auf Docker Hub (DOCKERHUB.md)
        if: env.DOCKERHUB == 'true' && startsWith(github.ref, 'refs/tags/')
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.DOCKERHUB_REPO }}
          readme-filepath: ./DOCKERHUB.md

      - name: Zusammenfassung
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.bau.outputs.digest }}
        run: |
          {
            echo "### Image veroeffentlicht"
            echo
            echo "Plattformen: \`$PLATTFORMEN\`, Digest: \`$DIGEST\`"
            echo
            echo '```'
            echo "$TAGS"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
